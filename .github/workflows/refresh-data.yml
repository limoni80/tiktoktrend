name: Refresh TikTok datasets
run-name: Collect TikTok — ${{ inputs.keyword || 'scheduled parallel refresh' }}

on:
  schedule:
    # Avoid minute 0/30, when GitHub's scheduled-run queue is busiest.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      keyword:
        description: Optional extra keyword for this run
        required: false
        type: string

permissions:
  contents: write
  # The collector authenticates each R2 upload to our Worker with a short-lived
  # GitHub OIDC token. No Cloudflare key or reusable upload secret is stored.
  id-token: write

# Different keywords may scrape in parallel. Repeated requests for the exact
# same keyword queue behind one another instead of consuming another runner.
concurrency:
  group: collect-tiktok-${{ inputs.keyword || github.run_id }}
  queue: max
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      keywords: ${{ steps.matrix.outputs.keywords }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Plan keyword matrix
        id: matrix
        run: node backend/scripts/plan-keywords.mjs
        env:
          EXTRA_KEYWORD: ${{ inputs.keyword }}
          MAX_KEYWORDS: "60"

  collect:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # GitHub queues above the account limit automatically. Fifteen runners
      # keep the scheduled catalogue fresher without serializing the work.
      max-parallel: 15
      matrix:
        keyword: ${{ fromJson(needs.plan.outputs.keywords) }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Restore Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('backend/package-lock.json') }}

      - name: Install collector dependencies
        run: npm ci --prefix backend --ignore-scripts

      - name: Install Chromium and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: backend
        run: npx playwright install --with-deps chromium

      - name: Verify cached Chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: backend
        run: npx playwright install chromium

      - name: Collect one public TikTok dataset
        run: node backend/scripts/collect.mjs
        env:
          EXTRA_KEYWORD: ${{ matrix.keyword }}
          MERGE_PUBLISH: "1"
          # A visitor waiting for a brand-new keyword needs the first page fast.
          # Scheduled datasets still collect the full configured depth.
          ON_DEMAND: ${{ inputs.keyword && '1' || '0' }}
          ON_DEMAND_PER_KEYWORD: "60"
          MEDIA_UPLOAD_BASE_URL: "https://tiktoktrend.limoniastrum.workers.dev/api/media-upload"
          MEDIA_PUBLIC_BASE_URL: "https://tiktoktrend.limoniastrum.workers.dev/api/media"
          MEDIA_PER_DATASET: "60"

      - name: Upload dataset shard
        uses: actions/upload-artifact@v4
        with:
          name: dataset-${{ strategy.job-index }}
          path: out
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [plan, collect]
    if: ${{ always() && needs.plan.result == 'success' && needs.collect.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this short commit stage is serialized. Browser collection remains
    # parallel, while every published shard is merged into the latest branch.
    concurrency:
      group: publish-tiktok-data
      queue: max
      cancel-in-progress: false

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Download all dataset shards
        uses: actions/download-artifact@v4
        with:
          pattern: dataset-*
          path: incoming

      - name: Merge and publish the data branch
        shell: bash
        run: |
          set -euo pipefail
          data_dir="$RUNNER_TEMP/tiktoktrend-data"
          git fetch origin data
          git worktree add --detach "$data_dir" origin/data

          node backend/scripts/merge-publish.mjs incoming "$data_dir"

          git -C "$data_dir" add -A
          git -C "$data_dir" config user.name "github-actions[bot]"
          git -C "$data_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git -C "$data_dir" diff --cached --quiet; then
            echo "Dataset output is unchanged."
          else
            git -C "$data_dir" commit -m "data: merge parallel TikTok datasets"
            git -C "$data_dir" push origin HEAD:data
          fi
