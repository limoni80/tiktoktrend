name: Refresh TikTok datasets

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      keyword:
        description: Optional extra keyword for this run
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: refresh-tiktok-datasets
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Restore Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('backend/package-lock.json') }}

      - name: Install collector dependencies
        run: npm ci --prefix backend --ignore-scripts

      - name: Install Chromium and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: backend
        run: npx playwright install --with-deps chromium

      - name: Verify cached Chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: backend
        run: npx playwright install chromium

      - name: Collect public TikTok datasets
        run: node backend/scripts/collect.mjs
        env:
          EXTRA_KEYWORD: ${{ inputs.keyword }}

      - name: Publish the data branch
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="$RUNNER_TEMP/tiktoktrend-data"
          mkdir -p "$publish_dir"
          cp -R out/. "$publish_dir/"

          git fetch origin data || true
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git switch --force-create data origin/data
          else
            git switch --orphan data
          fi

          git rm -rf --ignore-unmatch .
          cp -R "$publish_dir/." .
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "Dataset output is unchanged."
          else
            git commit -m "data: refresh TikTok datasets"
            git push origin HEAD:data
          fi
